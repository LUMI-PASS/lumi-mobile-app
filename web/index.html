<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lumi Pass">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumi Pass">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Lumi Pass</title>
  <link rel="manifest" href="manifest.json">

  <!-- Telegram Web App SDK — async so it never blocks page load -->
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      background: #F5F3FF;
      touch-action: pan-x pan-y;
    }

    #lumi-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #F5F3FF 0%, #EDE9FE 45%, #ffffff 100%);
      z-index: 9999;
      transition: opacity 0.4s ease;
      overflow: hidden;
    }
    #lumi-splash.out { opacity: 0; pointer-events: none; }

    /* Decorative blurred circles — match onboarding style */
    .deco {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
    }
    .deco-1 { width: 280px; height: 280px; top: -80px; right: -80px; background: rgba(166,82,199,.10); }
    .deco-2 { width: 200px; height: 200px; bottom: 120px; left: -60px; background: rgba(166,82,199,.07); }
    .deco-3 { width: 120px; height: 120px; top: 40%; right: -20px; background: rgba(255,112,147,.08); }

    /* Logo */
    #splash-logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      animation: logo-in 0.7s cubic-bezier(.22,.68,0,1.2) both;
    }
    @keyframes logo-in {
      from { opacity: 0; transform: scale(0.75); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Spinner */
    .ring {
      margin-top: 28px;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2.5px solid rgba(166,82,199,.2);
      border-top-color: #A652C7;
      animation: spin 0.9s linear infinite, logo-in 0.6s 0.4s ease both;
      opacity: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #lumi-err-box {
      display: none;
      margin-top: 24px;
      padding: 12px 16px;
      background: #fff3f3;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      max-width: 280px;
      text-align: center;
      font-family: -apple-system, sans-serif;
      font-size: 12px;
      color: #7f1d1d;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <!-- Splash: pure CSS, shows before any JS runs -->
  <div id="lumi-splash">
    <div class="deco deco-1"></div>
    <div class="deco deco-2"></div>
    <div class="deco deco-3"></div>
    <img id="splash-logo" src="assets/icons/lumi_logo.png" alt="Lumi" onerror="this.style.display='none'"/>
    <div class="ring"></div>
    <div id="lumi-err-box"></div>
  </div>

  <script>
    // Show error in the splash so we can see it inside Telegram's WebView
    function _lumiShowErr(msg) {
      var box = document.getElementById('lumi-err-box');
      if (box) { box.style.display = 'block'; box.textContent = msg; }
    }

    // Capture any unhandled JS errors
    window.onerror = function(msg, src, line) {
      _lumiShowErr('JS error: ' + msg + ' (' + (src || '').split('/').pop() + ':' + line + ')');
    };
    window.onunhandledrejection = function(e) {
      _lumiShowErr('Unhandled promise: ' + (e.reason || e));
    };

    // If Flutter hasn't started in 20 s, show a timeout message
    var _lumiTimeout = setTimeout(function() {
      _lumiShowErr('Timeout — app did not start. UA: ' + navigator.userAgent.slice(0, 80));
    }, 20000);

    window.addEventListener('flutter-first-frame', function() {
      clearTimeout(_lumiTimeout);
      var s = document.getElementById('lumi-splash');
      if (s) { s.classList.add('out'); setTimeout(function() { s.remove(); }, 350); }
    }, { once: true });

    // Init Telegram WebApp — wait for SDK if it loaded async
    function _initTg() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      tg.expand();
      tg.ready();
      if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
    }
    // Try now (in case SDK was already loaded), also hook load event
    _initTg();
    window.addEventListener('load', _initTg);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
