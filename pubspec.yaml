name: lumi_pass
description: "Founders Academy"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1


environment:
  sdk: ">=3.3.0-149.0.dev <4.0.0"


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  dio: 5.3.3
  retrofit: 4.0.3
  json_serializable: 6.7.1
  get_it: 7.6.4
  injectable: 2.3.2
  equatable: 2.0.5
  auto_route: 7.8.4
  flutter_bloc: 8.1.3
  logger: 2.0.2+1
  pretty_dio_logger: 1.3.1
  flutter_svg: 2.0.9

  flutter_local_notifications: ^19.2.1
  rxdart: 0.27.7
  json_annotation: ^4.8.1
  pinput: ^5.0.1
  freezed_annotation: 2.4.1

  shared_preferences: 2.2.2
  flutter_html: 3.0.0-beta.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: 2.1.3
  sms_autofill: ^2.4.1
  package_info_plus: 4.0.2
  firebase_core: 2.27.0
  firebase_crashlytics: 3.4.18
  syncfusion_flutter_pdfviewer: ^29.2.10
  image_picker: 1.0.8
  flutter_launcher_icons: any
  http_parser: 4.0.2
  firebase_remote_config: 4.3.17
  version: 3.0.2
  firebase_messaging: 14.7.10
  permission_handler: 11.3.1
  intl: 0.19.0
  webview_flutter: any
  webview_flutter_plus: any
  url_launcher: 6.2.5
  buttons_tabbar: ^1.3.13
  vimeo_player_flutter: any
  youtube_player_flutter: any
  flutter_cached_pdfview: ^0.4.2
  open_filex: ^4.5.0
  change_app_package_name: ^1.5.0







  # local packages
  chess_ui_kit:
    path: packages/chess_ui_kit
  auto_size_text: ^3.0.0
  http: ^1.2.2
  share_plus: ^11.0.0
  plus: ^0.1.0+1
  firebase_analytics: ^10.8.9

dependency_overrides:
  flutter_inappwebview: ^6.0.0
  youtube_player_flutter: ^9.1.1
  smart_auth: ^3.2.0
  build_runner: ^2.4.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.4.6
  retrofit_generator: 8.0.4
  flutter_gen_runner: 5.3.2
  injectable_generator: 2.4.1
  auto_route_generator: 7.3.2
  freezed: 2.4.7
  isar_generator: 3.1.0+1


  flutter_lints: ^3.0.0


flutter:

  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-Bold.ttf
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-ExtraBold.ttf
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-ExtraLight.ttf
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-Light.ttf
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-Italic.ttf
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-Black.ttf
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-SemiBold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: 'packages/chess_ui_kit/assets/images/logo_app.png'
  adaptive_icon_background_color: "#000000"

