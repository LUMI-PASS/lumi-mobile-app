name: lumi_pass
description: "Lumi Pass"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_serializable: ^6.7.1
  get_it: any
  injectable: ^2.3.2
  equatable: ^2.0.5
  auto_route: any
  flutter_bloc: ^8.1.3
  logger: ^2.0.2+1
  pretty_dio_logger: ^1.4.0
  flutter_svg: ^2.0.9
  flutter_local_notifications: ^19.2.1
  rxdart: ^0.28.0
  json_annotation: ^4.8.1
  pinput: any
  freezed_annotation: ^3.0.0

  shared_preferences: ^2.2.2
  flutter_html: ^3.0.0-beta.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  sms_autofill: ^2.4.1
  package_info_plus: any
  firebase_core: ^3.14.0
  firebase_crashlytics: ^4.3.7
  syncfusion_flutter_pdfviewer: ^29.2.10
  image_picker: ^1.1.2
  flutter_launcher_icons: ^0.14.4
  http_parser: ^4.1.2
  firebase_remote_config: ^5.4.5
  version: ^3.0.2
  firebase_messaging: ^15.2.7
  permission_handler: ^12.0.0+1
  intl: any
  webview_flutter: ^4.2.2
  webview_flutter_plus: ^0.4.19
  url_launcher: ^6.2.5
  buttons_tabbar: ^1.3.13
  youtube_player_flutter: ^9.1.1
  flutter_cached_pdfview: ^0.4.2
  open_filex: ^4.5.0
  change_app_package_name: ^1.5.0
  auto_size_text: ^3.0.0
  http: ^1.2.2
  share_plus: ^11.0.0
  plus: ^0.1.0+1
  firebase_analytics: ^11.5.0

  chess_ui_kit:
    path: packages/chess_ui_kit

dependency_overrides:
  build_runner: ^2.4.6
  dart_style: ^2.3.6
  analyzer: ^6.2.0
  source_gen: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  auto_route_generator: ^10.1.0
  injectable_generator: ^2.4.1
  freezed: ^3.0.6
  retrofit_generator: ^9.2.0
  isar_generator: ^3.1.0+1
  flutter_gen_runner: ^5.3.2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-Bold.ttf
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-ExtraBold.ttf
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-ExtraLight.ttf
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-Light.ttf
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-Italic.ttf
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-Black.ttf
        - asset: packages/chess_ui_kit/assets/fonts/Nunito-SemiBold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: 'packages/chess_ui_kit/assets/images/logo_app.png'
  adaptive_icon_background_color: "#000000"
