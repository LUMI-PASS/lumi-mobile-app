name: lumi_pass
description: "Lumi project"

publish_to: 'none'

version: 1.0.5+15

environment:
  sdk: ^3.5.4

workspace:
  - packages/location

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  location:
    path: packages/location
  geolocator: ^14.0.0
  auto_route: ^8.0.3
  get_it: ^7.6.8
  injectable: ^2.4.1
  freezed_annotation: ^2.4.1
  flutter_svg: any
  elegant_notification: ^2.1.0
  bloc: ^8.1.4
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  hive_flutter: ^1.1.0
  json_annotation: ^4.8.1
  logger: ^2.2.0
  hive: ^2.2.3
  cached_network_image: ^3.3.1
  lottie: ^3.1.0
  jwt_decoder: ^2.0.1
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  rxdart: ^0.27.7
  dio: ^5.4.2+1
  google_fonts: any
  collection: ^1.18.0
  mask_text_input_formatter: ^2.9.0
  smooth_page_indicator: ^1.1.0
  pinput: ^4.0.0
  path_provider: ^2.1.3
  image_picker: ^1.1.1
  intl: ^0.19.0
  focus_detector: ^2.0.1
  pretty_dio_logger: ^1.4.0
  flutter_screenutil: ^5.9.3
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  map_launcher: ^3.5.0
  searchfield: ^1.3.0
  calendar_date_picker2: ^2.0.0
  flutter_polyline_points: ^2.1.0
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.6
  firebase_remote_config: ^5.3.0
  firebase_analytics: ^11.4.0
  package_info_plus: ^8.3.0
  flutter_local_notifications: ^19.2.1
  dropdown_button2: ^2.3.9
  provider: ^6.1.5
  flutter_launcher_icons: ^0.14.3
  easy_localization: ^3.0.7+1
  easy_localization_loader: ^2.0.2
  easy_localization_generator: ^0.3.2
  csv: ^6.0.0
  shared_preferences: ^2.2.0
  socket_io_client: ^3.1.2
  flutter_phoenix: ^1.1.1
  shimmer: ^3.0.0
  share_plus: ^10.1.2
  app_links: ^6.3.4
  carousel_slider: ^5.1.1
  youtube_player_flutter: ^9.1.1
  webview_flutter: ^4.7.0
  # Glass "pill" bottom navigation (same component nexus-mobile-app uses).
  dynamic_glass_glmv: ^0.2.3
  # The native UITabBar behind `dynamic_glass_glmv`'s iOS 26 path. Depended on
  # directly so `CustomBottomBar` can drive `CNTabBar` itself and keep our own
  # tab SVGs template-tinted — see the note in custom_bottomnavigation.dart.
  cupertino_native_glmv: ^0.1.5


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  injectable_generator: ^2.6.1
  build_runner: ^2.4.9
  freezed: ^2.5.0
  auto_route_generator: ^8.0.0
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_gen_runner: 5.4.0
  flutter_gen_core: 5.4.0


dependency_overrides:
  csv: ^5.1.1
  intl: ^0.18.1

flutter:


  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/auth/
    - assets/icons/home/
    - assets/icons/main/
    - assets/icons/detail/
    - assets/icons/background/
    - assets/icons/notification/
    - assets/icons/profile/
    - assets/icons/coupons/
    - assets/images/
    - assets/images/banner/
    - assets/images/pay/
    - assets/localization/
    - assets/lotties/

flutter_gen:
  output: lib/common/gen
  integrations:
    flutter_svg: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: 'assets/images/app_icon.jpg'
  adaptive_icon_background_color: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.jpg"